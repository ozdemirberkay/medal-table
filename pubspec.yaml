name: medal_table
description: A medal table showing ranking. It can be made into a table with different information by changing the settings
version: 3.1.0
repository: https://github.com/ozdemirberkay/medal-table
topics:
  - widget
  - table
  - ranking
  - leaderboard
  - ui
screenshots:
  - description: 'Champions League titles: auto-sorted rows with medals, trend arrows and striped rows.'
    path: screenshots/ucl.png
  - description: 'Paris 2024 medal table with gold, silver and bronze columns and flag leadings.'
    path: screenshots/olympics.png
  - description: 'Top rated movies with custom medal colors and a highlighted, tappable row.'
    path: screenshots/imdb.png
  - description: 'Euro titles in a dark theme: tied rows share a rank and a medal (1, 2, 3, 3, 5).'
    path: screenshots/shared_ranks_dark.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
